[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskdora"
version = "3.2.0"
description = "Local-first desktop agent for Linux (Ubuntu/GNOME): accessibility-tree grounding with vision fallback, Ollama-powered planning, a mandatory-confirmation safety layer, and a complete audit log of every action."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DeskDora Contributors" }]
keywords = ["desktop-agent", "automation", "accessibility", "at-spi", "ollama", "linux"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# pyatspi is a system package (python3-pyatspi on Ubuntu), not on PyPI.

[project.scripts]
deskdora = "deskdora.cli:main"
deskdora-mcp = "deskdora.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
